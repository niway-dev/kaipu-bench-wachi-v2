name: Wachi bench review
# Benchmark copy. Replayed pull requests carry kaipu-record's own `agent-review.yml` (Wachi
# v1.2.0, the version that produced the 2026-10-31 field benchmark); that workflow is disabled in
# this repository's Actions settings so that only this one runs. Reviews are started on demand
# with `/wachiman review`, because a `pull_request` event would use the workflow at the replayed
# commit, not this one. Pin bumps here mark which engine version reviewed which run.
on:
  issue_comment: { types: [created] }
permissions: { contents: read, pull-requests: write, issues: read }
jobs:
  review:
    uses: niway-dev/wachiman/.github/workflows/review.yml@2dd954858c8c0e6fdb61185ec797f38cf7568bf4 # v1.13.0
    with:
      operator: csdev19
      model: claude-sonnet-5-5
      effort: high
      verify: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
